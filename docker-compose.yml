# Linux 单机 Docker Compose（设计文档 §11.1）
# knowledge-api / knowledge-worker / redis / postgresql(pgvector)
# 数据库与 Redis 不直接对外暴露；凭据通过环境变量注入，禁止提交真实密钥。

services:
  knowledge-api:
    build: .
    container_name: knowledge-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://knowledge:${POSTGRES_PASSWORD}@postgresql:5432/knowledge
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      STORAGE_ROOT: /data
      KNOWLEDGE_QUERY_API_KEY: ${KNOWLEDGE_QUERY_API_KEY}
      KNOWLEDGE_MANAGEMENT_API_KEY: ${KNOWLEDGE_MANAGEMENT_API_KEY}
    volumes:
      - ${STORAGE_ROOT_HOST:-./data}:/data
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  knowledge-worker:
    build: .
    container_name: knowledge-worker
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info --concurrency=2
    environment:
      DATABASE_URL: postgresql+psycopg://knowledge:${POSTGRES_PASSWORD}@postgresql:5432/knowledge
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      STORAGE_ROOT: /data
    volumes:
      - ${STORAGE_ROOT_HOST:-./data}:/data
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: knowledge-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgresql:
    image: pgvector/pgvector:pg16
    container_name: knowledge-postgresql
    environment:
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: knowledge
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data:
